server {
    server_name vtpayroll.in www.vtpayroll.in;

    client_max_body_size 50M;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    root /var/www/html/vtpayroll-landing;
    index index.html index.htm;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    listen [::]:443 ssl;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/iipe.vtpayroll.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/iipe.vtpayroll.in/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    server_name iipe.vtpayroll.in financeerp.iipe.ac.in 3.111.77.31;

    client_max_body_size 50M;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    location / {
        root /var/www/html/iipe-frontend;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    location ^~ /IIPEPayroll {
        alias /var/www/html/iipe-frontend;
        try_files $uri $uri/ /index.html;
    }

    location ^~ /IIPMPayroll {
        alias /var/www/html/iipe-frontend;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3330/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
    }

    location /static/ {
        root /var/www/html/iipe-frontend;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    listen [::]:443 ssl;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/iipe.vtpayroll.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/iipe.vtpayroll.in/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    listen [::]:80;
    server_name iipe.vtpayroll.in financeerp.iipe.ac.in 3.111.77.31;

    if ($host = iipe.vtpayroll.in) {
        return 301 https://$host$request_uri;
    }

    location / {
        root /var/www/html/iipe-frontend;
        index index.html index.htm;
